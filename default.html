<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="{{ page.description | default: 'Tiago Belintani — evolutionary biology, phylogenomics, bioinformatics, systematics and genomics.' }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

<body>

        <a href="{{ '/publications.html' | relative_url }}">Publications</a> |
        <a href="{{ '/research.html' | relative_url }}">Research</a> |

        <a href="{{ '/collaborators.html' | relative_url }}">Collaborators</a> |
        <a href="{{ '/contact.html' | relative_url }}">Contact</a>
      </nav>
    </header>

    <div class="footer-banner"></div>
    <footer>
      © 2025 Tiago Belintani<br>
      <span style="font-size:0.85em;color:#aaa;">Sapientia et disciplina</span>

</html>
